<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PDF Buttons</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-a: #081a32;
      --bg-b: #0d4f6b;
      --ink: #f5f4f0;
      --muted: #d6e2ea;
      --panel: rgba(255, 255, 255, 0.12);
      --panel-border: rgba(255, 255, 255, 0.22);
      --button: #ffc777;
      --button-hover: #ffdaa4;
      --button-ink: #2f1d08;
      --shadow: 0 20px 50px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: "Space Grotesk", sans-serif;
      background:
        radial-gradient(circle at 8% 12%, rgba(255, 178, 91, 0.22), transparent 36%),
        radial-gradient(circle at 92% 84%, rgba(242, 192, 120, 0.25), transparent 34%),
        linear-gradient(145deg, var(--bg-a), var(--bg-b) 44%, #041729);
      padding: clamp(12px, 2.2vw, 26px);
    }

    .shell {
      width: min(780px, 100%);
      margin: 0 auto;
      border: 1px solid var(--panel-border);
      border-radius: 20px;
      background: var(--panel);
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
      padding: clamp(16px, 3vw, 28px);
    }

    h1 {
      margin: 0;
      font-size: clamp(1.8rem, 4.8vw, 2.7rem);
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 8px 0 18px;
      color: var(--muted);
      line-height: 1.6;
    }

    h2 {
      margin: 0;
      font-size: 1rem;
      font-family: "IBM Plex Mono", monospace;
      color: #ffe3ba;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .group + .group {
      margin-top: 18px;
    }

    .button-grid {
      margin-top: 10px;
      display: grid;
      gap: 10px;
    }

    .btn {
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      border: none;
      border-radius: 12px;
      background: var(--button);
      color: var(--button-ink);
      font-family: "IBM Plex Mono", monospace;
      font-size: 0.9rem;
      font-weight: 600;
      padding: 12px 14px;
      cursor: pointer;
      transition: transform 160ms ease, background-color 160ms ease;
    }

    .btn:hover {
      transform: translateY(-1px);
      background: var(--button-hover);
    }

    .status {
      margin: 10px 0 0;
      color: var(--muted);
      min-height: 1.2em;
      font-size: 0.9rem;
    }

    .row {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .pdf-item {
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      background: rgba(5, 25, 40, 0.34);
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .pdf-title {
      margin: 0;
      color: #fbead0;
      font-size: 0.95rem;
      line-height: 1.4;
      word-break: break-word;
    }

    input[type="file"] {
      display: none;
    }

    @media (max-width: 640px) {
      .shell {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>PDF Buttons</h1>
    <p class="lead">Simple and clean: each PDF has a title and one Open button. Upload PDFs to add the same style automatically.</p>

    <section class="group">
      <h2>Actions</h2>
      <div class="row">
        <label for="uploadPdf" class="btn">Upload PDF(s)</label>
        <a class="btn" href="./index.html">Go to presentation</a>
        <input id="uploadPdf" type="file" accept="application/pdf" multiple />
      </div>
      <p class="status" id="uploadStatus">No uploaded PDF yet.</p>
    </section>

    <section class="group">
      <h2>Project PDFs</h2>
      <div class="button-grid" id="builtInList"></div>
    </section>

    <section class="group">
      <h2>Uploaded PDFs</h2>
      <div class="button-grid" id="uploadedList"></div>
    </section>
  </main>

  <script>
    const builtInPdfs = [
      { name: "Threads - Ch 4.pdf", href: "./Threads%20-%20Ch%204.pdf" },
      { name: "The Linux Programming Interface.pdf", href: "./The%20Linux%20Programming%20Interface.pdf" },
      { name: "Abraham-Silberschatz-Operating-System-Concepts-10th-2018.pdf", href: "./Abraham-Silberschatz-Operating-System-Concepts-10th-2018.pdf" }
    ];

    const uploadInput = document.getElementById("uploadPdf");
    const uploadStatus = document.getElementById("uploadStatus");
    const builtInList = document.getElementById("builtInList");
    const uploadedList = document.getElementById("uploadedList");

    const uploadedPdfs = new Map();

    function buildPdfItem(item) {
      const wrap = document.createElement("article");
      wrap.className = "pdf-item";

      const title = document.createElement("p");
      title.className = "pdf-title";
      title.textContent = item.name;

      const open = document.createElement("a");
      open.className = "btn";
      open.href = item.href;
      open.target = "_blank";
      open.rel = "noopener";
      open.textContent = "Open";

      wrap.append(title, open);
      return wrap;
    }

    function renderBuiltIn() {
      builtInList.innerHTML = "";
      builtInPdfs.forEach((item) => {
        builtInList.append(buildPdfItem(item));
      });
    }

    function renderUploaded() {
      uploadedList.innerHTML = "";
      Array.from(uploadedPdfs.values()).forEach((item) => {
        uploadedList.append(buildPdfItem(item));
      });
    }

    uploadInput.addEventListener("change", () => {
      const files = Array.from(uploadInput.files || []);

      if (files.length === 0) {
        uploadStatus.textContent = "Upload canceled.";
        return;
      }

      let addedCount = 0;

      files.forEach((file) => {
        const isPdf = file.type === "application/pdf" || file.name.toLowerCase().endsWith(".pdf");
        if (!isPdf) {
          return;
        }

        if (!uploadedPdfs.has(file.name)) {
          uploadedPdfs.set(file.name, {
            name: file.name,
            href: URL.createObjectURL(file)
          });
          addedCount += 1;
        }
      });

      if (addedCount === 0) {
        uploadStatus.textContent = "No valid PDF files were added.";
      } else {
        uploadStatus.textContent = `Added ${addedCount} PDF file${addedCount > 1 ? "s" : ""}.`;
      }

      uploadInput.value = "";
      renderUploaded();
    });

    renderBuiltIn();
  </script>
</body>
</html>
